<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tools & Technologies | Preetha</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }

    body {
      background: #050816;
      color: #fff;
      overflow-x: hidden;
    }

    /* ===== MENU ICON ===== */
    .menu-toggle {
      position: fixed;
      top: 20px;
      right: 25px;
      font-size: 2rem;
      color: #00f6ff;
      cursor: pointer;
      z-index: 20;
    }

    /* ===== RIGHT SLIDE MENU ===== */
    .sidebar {
      position: fixed;
      top: 0;
      right: -260px;
      width: 260px;
      height: 100vh;
      background: rgba(5, 8, 22, 0.9);
      backdrop-filter: blur(12px);
      padding: 30px 20px;
      z-index: 15;
      transition: right 0.4s ease;
    }

    .sidebar.active { right: 0; }

    .sidebar h1 {
      color: #00f6ff;
      text-align: center;
      margin-bottom: 40px;
    }

    .sidebar ul {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 25px;
      align-items: center;
    }

    .sidebar ul li a {
      color: #fff;
      font-size: 1.1rem;
      text-decoration: none;
      transition: 0.3s;
    }

    .sidebar ul li a:hover {
      color: #00f6ff;
      transform: translateX(-5px);
    }

    /* ===== TOOLS SECTION (UNCHANGED) ===== */
    .tools {
      padding: 140px 80px 80px;
      max-width: 1300px;
      margin: auto;
    }

    .title {
      font-size: 2.8rem;
      color: #00f6ff;
      margin-bottom: 50px;
    }

    .section {
      margin-bottom: 70px;
    }

    .section h3 {
      font-size: 1.9rem;
      margin-bottom: 30px;
      color: #7df9ff;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 35px;
      justify-items: center;
    }

    .tool-card {
      width: 130px;
      text-align: center;
      transition: transform 0.4s;
    }

    .tool-card:hover {
      transform: translateY(-10px);
    }

    .tool-img {
      width: 100%;
      height: 130px;
      border-radius: 22px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      box-shadow: 0 0 20px rgba(0,246,255,0.15);
      transition: box-shadow 0.4s;
    }

    .tool-card:hover .tool-img {
      box-shadow: 0 0 30px rgba(0,246,255,0.4);
    }

    .tool-img img {
      max-width: 70px;
      max-height: 70px;
    }

    .tool-name {
      margin-top: 12px;
      font-size: 0.9rem;
      font-weight: 600;
    }

    @media(max-width: 768px) {
      .tools { padding: 120px 30px; }
      .title { font-size: 2.2rem; }
      .sidebar h1 { display: none; }
    }
canvas {
  position: fixed;
  inset: 0;
  z-index: -1;
}

  </style>
</head>

<body>
<canvas id="bg"></canvas>

<!-- MENU ICON -->
<div class="menu-toggle" onclick="toggleMenu()">☰</div>

<!-- SLIDE MENU -->
<nav class="sidebar" id="sideMenu">
  <h1>Preetha</h1>
  <ul>
    <li><a href="index.html" onclick="closeMenu()">Home</a></li>
    <li><a href="aboutpage.html" onclick="closeMenu()">About</a></li>
    <li><a href="cpage.html" onclick="closeMenu()">Certificates</a></li>
    <li><a href="pro.html" onclick="closeMenu()">Projects</a></li>
    <li><a href="tools.html" onclick="closeMenu()">Tools</a></li>
    <li><a href="contacs.html" onclick="closeMenu()">Contact</a></li>
  </ul>
</nav>

<section class="tools">
  <h2 class="title">Tools & Technologies</h2>

  <!-- Coding -->
  <div class="section">
    <h3>Coding & Programming</h3>
    <div class="grid">
      <div class="tool-card"><div class="tool-img"><img src="assests/tools/python.png"></div><div class="tool-name">Python</div></div>
      <div class="tool-card"><div class="tool-img"><img src="assests/tools/r.png"></div><div class="tool-name">R</div></div>
      <div class="tool-card"><div class="tool-img"><img src="assests/tools/sql.png"></div><div class="tool-name">SQL</div></div>
      <div class="tool-card"><div class="tool-img"><img src="assests/tools/java.png"></div><div class="tool-name">Java</div></div>
    </div>
  </div>

  <!-- Visualization -->
  <div class="section">
    <h3>Visualization & BI Tools</h3>
    <div class="grid">
      <div class="tool-card"><div class="tool-img"><img src="assests/tools/Tab.png"></div><div class="tool-name">Tableau</div></div>
      <div class="tool-card"><div class="tool-img"><img src="assests/tools/P.png"></div><div class="tool-name">Power BI</div></div>
      <div class="tool-card"><div class="tool-img"><img src="assests/tools/x.png"></div><div class="tool-name">Excel</div></div>
      <div class="tool-card"><div class="tool-img"><img src="assests/tools/AI.png"></div><div class="tool-name">RapidMiner</div></div>
    </div>
  </div>

  <!-- Data Science -->
  <div class="section">
    <h3>Data Science & Machine Learning</h3>
    <div class="grid">
      <div class="tool-card"><div class="tool-img"><img src="assests/tools/n.png"></div><div class="tool-name">NumPy</div></div>
      <div class="tool-card"><div class="tool-img"><img src="assests/tools/ps.png"></div><div class="tool-name">Pandas</div></div>
      <div class="tool-card"><div class="tool-img"><img src="assests/tools/mon.png"></div><div class="tool-name">MongoDB</div></div>
      <div class="tool-card"><div class="tool-img"><img src="assests/tools/sci.png"></div><div class="tool-name">Scikit-learn</div></div>
    </div>
  </div>
</section>

<script>
  function toggleMenu() {
    document.getElementById("sideMenu").classList.toggle("active");
  }

  function closeMenu() {
    document.getElementById("sideMenu").classList.remove("active");
  }

  /* ===== PARTICLE BACKGROUND ===== */
  const canvas = document.getElementById('bg');
  const ctx = canvas.getContext('2d');
  let particles = [];

  canvas.width = innerWidth;
  canvas.height = innerHeight;

  class Particle {
    constructor() {
      this.x = Math.random() * canvas.width;
      this.y = Math.random() * canvas.height;
      this.size = Math.random() * 2 + 0.5;
      this.speedX = (Math.random() - 0.5) * 0.7;
      this.speedY = (Math.random() - 0.5) * 0.7;
    }
    update() {
      this.x += this.speedX;
      this.y += this.speedY;
      if (this.x < 0 || this.x > canvas.width) this.speedX *= -1;
      if (this.y < 0 || this.y > canvas.height) this.speedY *= -1;
    }
    draw() {
      ctx.fillStyle = '#00f6ff';
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function initParticles() {
    particles = [];
    for (let i = 0; i < 120; i++) particles.push(new Particle());
  }

  function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles.forEach(p => { p.update(); p.draw(); });
    requestAnimationFrame(animate);
  }

  addEventListener('resize', () => {
    canvas.width = innerWidth;
    canvas.height = innerHeight;
    initParticles();
  });

  initParticles();
  animate();
</script>

</body>
</html>
